buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // react-native-geolocation-service v5.3.1 must be compiled against play-services-location 21.x
        // (SettingsClient/FusedLocationProviderClient became interfaces there). This name is read by
        // react-native-geolocation-service's android/build.gradle via safeExtGet.
        playServicesLocationVersion = "21.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Expose to subprojects: react-native-geolocation-service v5.3.1 must be compiled against
// play-services-location 21.x (SettingsClient/FusedLocationProviderClient became interfaces there)
// to match react-native-maps, which references the interface forms. It reads this via safeExtGet.
ext.playServicesLocationVersion = "21.3.0"
